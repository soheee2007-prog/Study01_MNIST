<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>손글씨 숫자 인식 (MNIST CNN)</title>
<link rel="stylesheet" href="스타일.css">
<script type="module" src="앱.js"></script>
</head>
<body>
<h1>손글씨 숫자 인식 (MNIST CNN)</h1>
<p id="안내-file">이 페이지는 웹 서버로 열어야 합니다. web_version 폴더에서 python -m http.server 를 실행한 뒤 http://localhost:8000 으로 여세요.</p>
<script>
  // file://로 연 경우에만 안내문을 보여줍니다. 이 스크립트는 모듈이 아니라 일반 스크립트라서
  // file://에서도 CORS 없이 실행되므로, 모듈(앱.js)이 404 등으로 실행되지 못해도 안내문이 잘못 남지 않습니다.
  if (location.protocol !== "file:") {
    document.getElementById("안내-file").hidden = true;
  }
</script>
<main class="배치">
  <canvas id="그림판" width="280" height="280" aria-label="숫자를 그리는 그림판"></canvas>
  <section class="결과판" aria-labelledby="결과제목">
    <h2 id="결과제목">인식 결과</h2>
    <div id="결과" aria-live="polite">?</div>
    <p id="확신도" role="status">모델을 불러오는 중입니다</p>
    <ol id="후보" aria-label="상위 3개 후보"></ol>
    <div id="막대들" aria-label="0~9 확률"></div>
    <button id="지우기" type="button">지우기</button>
  </section>
</main>
<p class="도움말">마우스·손가락·펜으로 숫자를 그리면 손을 뗄 때 자동으로 인식합니다. 오른쪽 클릭이나 Delete 키로도 지울 수 있습니다.</p>
</body>
</html>
